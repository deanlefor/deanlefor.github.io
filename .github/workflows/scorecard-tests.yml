name: Scorecard tests

on:
  push:
    paths:
      - 'projects/**'
      - '.github/workflows/scorecard-tests.yml'
  pull_request:
    paths:
      - 'projects/**'
      - '.github/workflows/scorecard-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run scorecard tests
        run: node --test projects/*.test.js
