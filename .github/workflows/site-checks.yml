name: Website checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/fers-retirement/package-lock.json
      - run: npm ci
      - name: Test site behavior, public links, syntax, and scorecards
        run: npm test
      - run: npm ci --prefix apps/fers-retirement
      - name: Test, type-check, and rebuild the retirement planner
        run: npm run check --prefix apps/fers-retirement
      - name: Require the committed calculator build to match its source
        run: |
          git diff --exit-code -- fers-retirement/
          test -z "$(git ls-files --others --exclude-standard fers-retirement/)"
