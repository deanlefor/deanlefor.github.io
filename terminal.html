<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dean Lefor | DOS Terminal</title>
  <link
    href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
    rel="stylesheet"/>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.ico" />
</head>
<body>
  <nav id="terminal-privacy" aria-label="Privacy" style="height:32px;display:flex;align-items:center;justify-content:flex-end;padding:0 16px;font-size:16px"><a href="privacy.html" style="color:inherit">Privacy and your data</a></nav>
  <div id="splash"><pre id="splash-output"></pre></div>
  <div id="terminal" style="display:none;">
    <pre id="output"></pre>
    <div id="input-wrapper">
      <span id="prompt-line">C:\dean&gt;</span>
      <span id="typed-text"></span><span id="fake-cursor"></span>
    </div>
  </div>

  <!-- Hidden mobile input -->
  <input aria-label="Terminal command" autocomplete="off" autocapitalize="off" spellcheck="false" id="mobile-input" type="text" style="position:absolute;bottom:0;left:0;width:100%;height:40px;opacity:0.01;border:none;outline:none;z-index:1000" />

  <!-- Modular scripts -->
  <script src="filesystem.js"></script>
  <script src="boot.js"></script>
  <script src="terminal.js"></script>
  <script src="input.js"></script>
  <script src="commands.js"></script>
  <script src="runner.js"></script>
</body>
</html>
